name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'  # Triggers when you push a tag like v1.0.0

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake node

      - name: Build plugin (Release)
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)

      - name: Collect binaries
        run: |
          mkdir -p release-artifacts/VST3 release-artifacts/AU
          cp -r build/Reverbo_artefacts/Release/Standalone/Reverbo.app release-artifacts/
          cp -r build/Reverbo_artefacts/Release/VST3/Reverbo.vst3 release-artifacts/VST3/
          cp -r build/Reverbo_artefacts/Release/AU/Reverbo.component release-artifacts/AU/

      - name: Create release archive
        run: |
          cd release-artifacts
          zip -r ../Reverbo-${{ github.ref_name }}-macOS.zip .

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: Reverbo-${{ github.ref_name }}-macOS.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
